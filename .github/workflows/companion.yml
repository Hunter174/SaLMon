name: Test salmon-model Companion

on:
  pull_request:
    paths:
      - 'tools/salmon-model/**'
      - '.github/workflows/companion.yml'
  push:
    branches: [main, master]
    paths:
      - 'tools/salmon-model/**'
      - '.github/workflows/companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/salmon-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: tools/salmon-model/go.mod
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build standalone companion
        run: go build ./cmd/salmon-model
