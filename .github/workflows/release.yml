name: Build and Test SaLMoN

# Build from source. Never publish historical tracked binaries as a new release.
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        godot_target: [template_debug, template_release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure portable CPU runtime
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=${{ matrix.godot_target }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Release --parallel 4
      - name: Native tests (no model downloads)
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Stage runtime notices and flatten multi-config output
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('build/ci/addon')
          binary_dir = root / 'addons/salmon/bin'
          for config in ('Release', 'Debug', 'RelWithDebInfo', 'MinSizeRel'):
              nested = binary_dir / config
              if nested.exists():
                  for file in nested.iterdir():
                      if file.suffix in ('.dll', '.so', '.dylib'):
                          shutil.copy2(file, binary_dir / file.name)
                  shutil.rmtree(nested)
          notices = root / 'notices'
          notices.mkdir(parents=True, exist_ok=True)
          for source, name in [('LICENSE', 'SaLMoN.txt'), ('lib/llama.cpp/LICENSE', 'llama.cpp.txt'), ('lib/godot-cpp/LICENSE.md', 'godot-cpp.txt')]:
              shutil.copy2(source, notices / name)
          shutil.copy2('README.md', root / 'README.md')
          shutil.copytree('docs', root / 'docs', dirs_exist_ok=True)
          assert list(binary_dir.glob('*.*')), 'No generated extension artifact'
          assert not list(root.rglob('*.gguf')), 'Runtime must not include model weights'
      - uses: actions/upload-artifact@v4
        with:
          name: salmon-cpu-${{ matrix.os }}-${{ matrix.godot_target }}-preview
          path: build/ci/addon/
          if-no-files-found: error

# These are unverified preview artifacts, not published releases. Headless Godot,
# export, dependency and GPU checks are tracked in #9; fresh Windows import in #11.
